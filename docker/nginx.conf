# CYBERNEXUS nginx configuration for the frontend container.
# Serves the static SPA and proxies API calls to the backend service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default security headers for the SPA responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Static assets (hashed filenames can be cached aggressively).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to the backend service inside the compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}